<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Pagamentos - EduPay 2026</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/payments.css">
    <link rel="stylesheet" href="css/animations.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <span>EduPay</span>
            </div>
            <button class="sidebar-close" id="sidebar-close">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="students.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span>Alunos</span>
            </a>
            <a href="payments.html" class="nav-item active">
                <i class="fas fa-money-bill-wave"></i>
                <span>Pagamentos</span>
            </a>
            <a href="reports.html" class="nav-item">
                <i class="fas fa-file-chart-line"></i>
                <span>Relatórios</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>Configurações</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button onclick="logout()" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sair</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="header-title">
                    <h1>Gestão de Pagamentos</h1>
                    <p>Controle todos os pagamentos e referências</p>
                </div>
            </div>

            <div class="header-right">
                <button class="btn-primary" id="generate-payment-btn">
                    <i class="fas fa-plus"></i> Gerar Referência
                </button>
            </div>
        </header>

        <!-- Content -->
        <div class="content-container">
            <!-- Filters -->
            <section class="filters-section">
                <div class="filter-group">
                    <input type="text" id="payment-search" placeholder="Pesquisar pagamento..." class="filter-input">
                </div>
                <div class="filter-group">
                    <select id="payment-status-filter" class="filter-select">
                        <option value="all">Todos os Status</option>
                        <option value="completo">Completo</option>
                        <option value="pendente">Pendente</option>
                        <option value="atraso">Em Atraso</option>
                    </select>
                </div>
                <div class="filter-group">
                    <button class="btn-secondary" onclick="exportPaymentsReport()">
                        <i class="fas fa-download"></i> Exportar
                    </button>
                </div>
            </section>

            <!-- Payments Table -->
            <section class="table-section">
                <div class="table-card">
                    <div class="card-header">
                        <h2>Histórico de Pagamentos</h2>
                    </div>
                    <div class="table-responsive">
                        <table id="payments-table">
                            <thead>
                                <tr>
                                    <th>Aluno</th>
                                    <th>Valor</th>
                                    <th>Data</th>
                                    <th>Status</th>
                                    <th>Método</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Payments will be rendered here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Payment Modal -->
    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Editar Pagamento</h2>
                <button class="close-payment-modal" onclick="closePaymentModal()">&times;</button>
            </div>
            <form class="modal-body">
                <input type="hidden" id="payment-id">
                
                <div class="form-group">
                    <label for="payment-student">Aluno</label>
                    <input type="text" id="payment-student" disabled>
                </div>
                
                <div class="form-group">
                    <label for="payment-amount">Valor (€)</label>
                    <input type="number" id="payment-amount" disabled step="0.01">
                </div>
                
                <div class="form-group">
                    <label for="payment-method">Método de Pagamento</label>
                    <select id="payment-method">
                        <option value="transferência">Transferência Bancária</option>
                        <option value="cartão">Cartão de Crédito</option>
                        <option value="referência">Referência Multibanco</option>
                        <option value="outras">Outras</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="payment-status">Status</label>
                    <select id="payment-status">
                        <option value="completo">Completo</option>
                        <option value="pendente">Pendente</option>
                        <option value="atraso">Em Atraso</option>
                    </select>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closePaymentModal()">Cancelar</button>
                    <button type="button" class="btn-primary" id="save-payment-btn">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/payments.js"></script>
</body>
</html>
